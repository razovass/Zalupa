<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: sticky top bar with role tabs; one working column (max 1120px); cards for disciplines, one wide table for the teacher. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#16202b; --muted:#5f6b78; --line:#dde2e8;
  --accent:#23477a; --accent-soft:#e3ebf6; --accent-ink:#ffffff;
  --ok:#1b7a4b; --ok-soft:#dff3e8; --warn:#9a5b00; --warn-soft:#fdf0d5; --bad:#b3261e; --bad-soft:#fbe3e1;
  --hatch:#e9c9c6;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#17202a; --ink:#e7ecf2; --muted:#9aa7b5; --line:#293545;
  --accent:#7fa8e6; --accent-soft:#1d2d44; --accent-ink:#0f151c;
  --ok:#5fd09a; --ok-soft:#14352a; --warn:#f0b34d; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3d1c1a; --hatch:#5a3a38;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#17202a; --ink:#e7ecf2; --muted:#9aa7b5; --line:#293545;
  --accent:#7fa8e6; --accent-soft:#1d2d44; --accent-ink:#0f151c;
  --ok:#5fd09a; --ok-soft:#14352a; --warn:#f0b34d; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3d1c1a; --hatch:#5a3a38;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding-block:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:1px solid transparent;background:none;padding:7px 14px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
nav button:hover{background:var(--accent-soft);color:var(--ink)}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main{padding-top:24px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.head h2{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.2}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctrl label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
select,input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px}
select{max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500;min-height:36px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{color:var(--accent-ink);opacity:.9}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:16px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big .v{font-family:var(--f-display);font-weight:500;font-size:40px;line-height:1}
.big .u{color:var(--muted);font-size:13px}
.meter{position:relative;height:14px;border-radius:4px;background:var(--accent-soft);margin-top:6px}
.meter i{position:absolute;top:0;bottom:0;left:0;border-radius:4px 0 0 4px;background:var(--accent)}
.meter i.lost{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 8px);border-radius:0}
.meter u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);text-decoration:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.acts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.acts li{display:grid;grid-template-columns:minmax(0,1fr) 70px 56px;gap:10px;align-items:center;font-size:13px}
.acts .mini{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden}
.acts .mini i{display:block;height:100%;background:var(--accent)}
.acts li.na{color:var(--muted)}
.acts .pts{text-align:right}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--muted);margin:0}
.tips{margin:0;padding:12px 14px;border-radius:8px;background:var(--accent-soft);font-size:13px;display:flex;flex-direction:column;gap:6px;list-style:none}
.tips li::before{content:"→ ";color:var(--accent);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:13px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--bg);white-space:normal;min-width:76px}
th small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--f-mono)}
tr:last-child td{border-bottom:0}
td input[type=number]{width:64px;padding:5px 6px;min-height:32px;font-family:var(--f-mono)}
td input[type=text]{width:100%;min-width:170px;padding:5px 8px;min-height:32px}
td.c{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.r-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.r-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.sum{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.sum .card{gap:6px;padding:14px 16px}
.sum .k{font-size:12px;color:var(--muted)}
.sum .v{font-family:var(--f-display);font-size:26px;font-weight:500;line-height:1.1}
.sum .s{font-size:12px;color:var(--muted)}
.settings{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.settings label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.settings input{width:100%;font-family:var(--f-mono)}
details.card summary{cursor:pointer;font-weight:600}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.formula{font-family:var(--f-mono);font-size:15px;background:var(--accent-soft);padding:10px 14px;border-radius:8px;overflow-x:auto;white-space:nowrap}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px 70px 34px;gap:8px;align-items:center}
.calc-row input{width:100%;font-family:var(--f-mono)}
.calc-row.h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
textarea{width:100%;min-height:150px;font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
ol.rank{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
footer{margin-top:28px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
@media (max-width:560px){
  .big .v{font-size:32px}
  .calc-row{grid-template-columns:minmax(0,1fr) 70px 70px 56px 30px}
}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .35s ease}}
</style>

<header class="top"><div class="bar">
  <div class="brand"><b>БРС · Академический успех</b><span>Балльно-рейтинговая система · команда «Космос» · РУТ (МИИТ)</span></div>
  <nav id="nav" aria-label="Разделы"></nav>
</div></header>
<div class="wrap"><main id="view"></main>
<footer><span>Демо-данные: студенты вымышленные. Изменения сохраняются в этом браузере.</span><span>Цель проекта: снизить академические задолженности на 20%</span></footer></div>

<script>
(function(){
'use strict';
var KEY='brs-miit-v1';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var f1=function(x){return (Math.round(x*10)/10).toString().replace('.',',')};
var clamp=function(x,a,b){return Math.max(a,Math.min(b,x))};

/* ---------- данные ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var ACTS=[['att','Посещаемость занятий',10],['prac','Практические и лабораторные',20],['test','Контрольные работы',25],['hw','Домашние задания',15],['self','Самостоятельная работа',10],['mid','Рубежный тест',15],['bonus','Наука, проекты, конференции',5]];
var NAMES=['Абрамов Илья','Белова Мария','Воронин Артём','Гусева Полина','Данилов Кирилл','Егорова Алина','Жуков Максим','Зайцева Дарья','Иванцов Никита','Кузнецова Анна','Лебедев Егор','Макарова София'];
var SKILL=[.9,.82,.68,.55,.38,.8,.3,.72,.62,.88,.45,.7];
var MISS=[0,0,0,1,3,0,4,0,2,0,2,0];
function mkDisc(name,seed,shift){
  var r=rng(seed);
  return {name:name,auto:60,pass:55,wT:0.2,
    acts:ACTS.map(function(a){return {id:a[0],name:a[1],w:a[2]}}),
    students:NAMES.map(function(n,i){
      var sc={};
      ACTS.forEach(function(a,j){
        if(j>4){sc[a[0]]=null;return}
        sc[a[0]]=Math.round(clamp((SKILL[(i+shift)%12])*100+(r()-.5)*34,0,100));
      });
      return {id:'s'+i,name:n,scores:sc,missed:MISS[(i+shift)%12]};
    })};
}
function init(){return {tab:'student',di:0,si:3,onlyRisk:false,csv:'',
  discs:[mkDisc('Математика',11,0),mkDisc('Физика',22,3),mkDisc('Информатика',33,7)]}}
var S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!S.discs||!S.discs.length)S=init();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- формулы БРС ---------- */
// B = S*W/100;  РТ = сумма B;  РИД = РТ*wT + РАД*(1-wT)
function grade(d,v){return v>=85?5:v>=70?4:v>=d.pass?3:2}
function calc(d,st){
  var earned=0,max=0,per={};
  d.acts.forEach(function(a){
    var s=st.scores[a.id];
    if(s===null||s===undefined||s==='')return;
    var b=s*a.w/100; per[a.id]=b; earned+=b; max+=a.w;
  });
  var pct=max?earned/max*100:null;
  var reasons=[],lvl=0;
  if(pct!==null&&pct<50){lvl=2;reasons.push('успеваемость '+f1(pct)+'% от набранного максимума')}
  else if(pct!==null&&pct<d.auto){lvl=1;reasons.push('ниже порога автомата ('+d.auto+'%)')}
  if(st.missed>=3){lvl=2;reasons.push('пропуски '+st.missed+' нед. подряд')}
  else if(st.missed===2){lvl=Math.max(lvl,1);reasons.push('пропуски 2 нед. подряд')}
  return {earned:earned,max:max,per:per,pct:pct,lvl:lvl,reasons:reasons};
}
var LV=[['ok','В графике'],['warn','Следить'],['bad','Нужна помощь']];
function pill(l){return '<span class="pill '+LV[l][0]+'">'+LV[l][1]+'</span>'}
function ranks(d){
  var arr=d.students.map(function(s){return {id:s.id,e:calc(d,s).earned}});
  arr.sort(function(a,b){return b.e-a.e});
  var m={};arr.forEach(function(x,i){m[x.id]=i+1});return m;
}
function wsum(d){return d.acts.reduce(function(t,a){return t+a.w},0)}

/* ---------- навигация ---------- */
var TABS=[['student','Студент'],['teacher','Преподаватель'],['calc','Калькулятор'],['about','О системе']];
function nav(){
  $('#nav').innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join('');
}
function go(t,noHash){S.tab=t;save();if(!noHash){try{history.replaceState(null,'','#'+t)}catch(e){location.hash=t}}render()}
function render(){nav();({student:vStudent,teacher:vTeacher,calc:vCalc,about:vAbout})[S.tab]();}

/* ---------- студент ---------- */
function vStudent(){
  var d0=S.discs[0];
  var si=clamp(S.si,0,d0.students.length-1);S.si=si;
  var me=d0.students[si];
  var cards=S.discs.map(function(d){
    var st=d.students[si]||d.students[0];
    var c=calc(d,st),rk=ranks(d),N=d.students.length;
    var projRT=c.pct===null?0:c.pct;
    var wA=1-d.wT;
    var autoOk=c.pct!==null&&projRT>=d.auto;
    var lost=c.max-c.earned;
    var meter='<div class="meter" role="img" aria-label="Набрано '+f1(c.earned)+' из 100 баллов"><i style="width:'+c.earned+'%"></i><i class="lost" style="left:'+c.earned+'%;width:'+lost+'%"></i><u style="left:'+d.auto+'%" title="Порог автомата"></u></div>'+
      '<div class="legend"><span style="--c:var(--accent)">набрано</span><span style="--c:var(--hatch)">потеряно</span><span style="--c:var(--ink)">автомат '+d.auto+'</span></div>';
    var rows=d.acts.map(function(a){
      var b=c.per[a.id];
      if(b===undefined)return '<li class="na"><span>'+esc(a.name)+'</span><span class="mini"></span><span class="pts num">— / '+a.w+'</span></li>';
      return '<li><span>'+esc(a.name)+'</span><span class="mini"><i style="width:'+(b/a.w*100)+'%"></i></span><span class="pts num">'+f1(b)+' / '+a.w+'</span></li>';
    }).join('');
    var exam='';
    if(autoOk){exam='<p class="note"><b style="color:var(--ok)">Автомат возможен.</b> При таком темпе РТ около '+Math.round(projRT)+' — оценка «'+grade(d,projRT)+'» без экзамена.</p>'}
    else{
      var need=function(t){var x=Math.ceil((t-projRT*d.wT)/wA);return x>100?'недостижимо':x+' баллов'};
      exam='<p class="note">Автомата не будет, если темп не вырастет. Чтобы сдать экзамен (РИД = РТ×'+d.wT+' + РАД×'+f1(wA)+'), при прогнозе РТ '+Math.round(projRT)+' нужно РАД: на «3» — <b class="num">'+need(d.pass)+'</b>, на «4» — <b class="num">'+need(70)+'</b>, на «5» — <b class="num">'+need(85)+'</b>.</p>';
    }
    var tips=[];
    var worst=null;d.acts.forEach(function(a){var b=c.per[a.id];if(b!==undefined){var l=a.w-b;if(!worst||l>worst.l)worst={l:l,n:a.name}}});
    if(worst&&worst.l>=4)tips.push('Больше всего баллов потеряно за «'+esc(worst.n)+'» (−'+f1(worst.l)+'). Исправьте это в первую очередь.');
    if(st.missed>=2)tips.push('Вы пропускаете занятия '+st.missed+' нед. подряд. Напишите преподавателю или старосте сегодня: догнать материал позже сложнее.');
    var fut=d.acts.filter(function(a){return c.per[a.id]===undefined});
    if(fut.length)tips.push('Впереди: '+fut.map(function(a){return esc(a.name)+' ('+a.w+' б.)'}).join(', ')+'.');
    return '<section class="card"><div class="row"><h3>'+esc(d.name)+'</h3>'+pill(c.lvl)+'</div>'+
      '<div><div class="big"><span class="v num">'+f1(c.earned)+'</span><span class="u">баллов из 100 · текущий рейтинг РТ</span></div>'+meter+'</div>'+
      '<div class="facts"><span>Место в группе: <b>'+rk[st.id]+' из '+N+'</b></span><span>Успеваемость: <b>'+(c.pct===null?'—':f1(c.pct)+'%')+'</b></span><span>Пропуски подряд: <b>'+st.missed+' нед.</b></span></div>'+
      '<ul class="acts">'+rows+'</ul>'+exam+
      (tips.length?'<ul class="tips">'+tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul>':'')+'</section>';
  }).join('');
  $('#view').innerHTML='<div class="head"><div><h2>Мой рейтинг</h2><p>Баллы по каждой дисциплине, прогноз автомата и что делать, чтобы не набрать долгов.</p></div>'+
    '<div class="ctrl"><label for="pickStudent">Студент (демо-вход)<select id="pickStudent">'+d0.students.map(function(s,i){return '<option value="'+i+'"'+(i===si?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select></label></div></div>'+
    '<div class="grid">'+cards+'</div>';
}

/* ---------- преподаватель ---------- */
function vTeacher(){
  var d=S.discs[clamp(S.di,0,S.discs.length-1)];
  var settings=d.acts.map(function(a){return '<label>'+esc(a.name)+', вес W<input type="number" min="0" max="100" step="1" value="'+a.w+'" data-k="w" data-aid="'+a.id+'" id="w-'+a.id+'"></label>'}).join('')+
    '<label>Порог автомата, баллов<input type="number" min="0" max="100" value="'+d.auto+'" data-k="auto" id="set-auto"></label>'+
    '<label>Минимум для «3»<input type="number" min="0" max="100" value="'+d.pass+'" data-k="pass" id="set-pass"></label>'+
    '<label>Вес текущего рейтинга в РИД<input type="number" min="0" max="1" step="0.05" value="'+d.wT+'" data-k="wT" id="set-wT"></label>';
  var head='<tr><th>Студент</th>'+d.acts.map(function(a){return '<th>'+esc(a.name)+'<small id="th-'+a.id+'">вес '+a.w+'</small></th>'}).join('')+'<th>Пропуски, нед.</th><th>РТ</th><th>Успев.</th><th>Статус</th><th></th></tr>';
  $('#view').innerHTML='<div class="head"><div><h2>Журнал группы</h2><p>Введите оценки в процентах выполнения (0–100). Пустая клетка значит, что работа ещё не проведена. Баллы и риск пересчитываются сразу.</p></div>'+
    '<div class="ctrl"><label for="pickDisc">Дисциплина<select id="pickDisc">'+S.discs.map(function(x,i){return '<option value="'+i+'"'+(S.discs[S.di]===x?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select></label>'+
    '<label style="flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)"><input type="checkbox" id="onlyRisk"'+(S.onlyRisk?' checked':'')+'> только зона риска</label></div></div>'+
    '<div class="sum" id="sum"></div>'+
    '<div class="tw"><table><thead>'+head+'</thead><tbody id="tbody"></tbody></table></div>'+
    '<div class="row"><button class="btn" id="addSt">+ Добавить студента</button><button class="btn" id="mkCsv">Таблица в CSV</button></div>'+
    '<div id="csvBox" '+(S.csv?'':'hidden')+' class="card"><div class="row"><b>CSV: скопируйте и вставьте в Excel или Google Таблицы</b><button class="btn" id="copyCsv">Копировать</button></div><textarea id="csvText" readonly>'+esc(S.csv)+'</textarea></div>'+
    '<details class="card"><summary>Настройки дисциплины: веса видов работ и пороги</summary><div class="settings" style="margin-top:12px">'+settings+'</div><p class="hint" id="wcheck"></p></details>'+
    '<div class="two"><section class="card"><h3>Рейтинг группы</h3><ol class="rank" id="rank"></ol></section><section class="card"><h3>Кому написать сегодня</h3><div id="alerts"></div></section></div>';
  drawRows();summary();wcheck();
}
function drawRows(){
  var d=S.discs[S.di];
  var html='';
  d.students.forEach(function(st,i){
    var c=calc(d,st);
    if(S.onlyRisk&&c.lvl===0)return;
    html+='<tr id="row-'+st.id+'" class="r-'+(c.lvl===2?'bad':c.lvl===1?'warn':'ok')+'"><td><input type="text" aria-label="Фамилия и имя" value="'+esc(st.name)+'" data-k="name" data-sid="'+st.id+'" id="n-'+st.id+'"></td>'+
      d.acts.map(function(a){var v=st.scores[a.id];return '<td><input type="number" min="0" max="100" aria-label="'+esc(a.name)+'" placeholder="—" value="'+(v===null||v===undefined?'':v)+'" data-k="score" data-sid="'+st.id+'" data-aid="'+a.id+'" id="sc-'+st.id+'-'+a.id+'"></td>'}).join('')+
      '<td><input type="number" min="0" max="20" aria-label="Пропуски подряд, недель" value="'+st.missed+'" data-k="missed" data-sid="'+st.id+'" id="ms-'+st.id+'"></td>'+
      '<td class="c" data-f="rt"></td><td class="c" data-f="pct"></td><td data-f="lvl"></td>'+
      '<td><button class="btn danger" data-del="'+st.id+'" aria-label="Удалить студента" title="Удалить" style="padding:4px 9px;min-height:30px">✕</button></td></tr>';
  });
  $('#tbody').innerHTML=html||'<tr><td colspan="'+(d.acts.length+6)+'" class="note" style="padding:18px">Нет студентов в зоне риска.</td></tr>';
  d.students.forEach(function(st){refreshRow(st.id)});
}
function refreshRow(id){
  var d=S.discs[S.di],st=d.students.filter(function(s){return s.id===id})[0],tr=$('#row-'+id);
  if(!st||!tr)return;
  var c=calc(d,st);
  tr.className='r-'+(c.lvl===2?'bad':c.lvl===1?'warn':'ok');
  $('[data-f=rt]',tr).textContent=f1(c.earned);
  $('[data-f=pct]',tr).textContent=c.pct===null?'—':f1(c.pct)+'%';
  var cell=$('[data-f=lvl]',tr);cell.innerHTML=pill(c.lvl);cell.title=c.reasons.join('; ');
}
function summary(){
  var d=S.discs[S.di],n=d.students.length,cnt=[0,0,0],sum=0,k=0;
  d.students.forEach(function(s){var c=calc(d,s);cnt[c.lvl]++;if(c.pct!==null){sum+=c.pct;k++}});
  var share=n?cnt[2]/n*100:0;
  $('#sum').innerHTML=
   '<div class="card"><span class="k">Средняя успеваемость</span><span class="v num">'+(k?f1(sum/k)+'%':'—')+'</span><span class="s">от набранного максимума</span></div>'+
   '<div class="card"><span class="k">В графике</span><span class="v num" style="color:var(--ok)">'+cnt[0]+'</span><span class="s">из '+n+' студентов</span></div>'+
   '<div class="card"><span class="k">Следить</span><span class="v num" style="color:var(--warn)">'+cnt[1]+'</span><span class="s">ниже порога автомата или 2 нед. пропусков</span></div>'+
   '<div class="card"><span class="k">Нужна помощь</span><span class="v num" style="color:var(--bad)">'+cnt[2]+'</span><span class="s">'+f1(share)+'% группы'+(share>10?' · выше критических 10–12%':' · в пределах нормы')+'</span></div>';
  var rk=d.students.map(function(s){return {n:s.name,e:calc(d,s).earned}}).sort(function(a,b){return b.e-a.e});
  $('#rank').innerHTML=rk.map(function(x){return '<li>'+esc(x.n)+' <span class="num" style="color:var(--muted)">— '+f1(x.e)+'</span></li>'}).join('');
  var al=d.students.map(function(s){return {s:s,c:calc(d,s)}}).filter(function(x){return x.c.lvl>0}).sort(function(a,b){return b.c.lvl-a.c.lvl});
  $('#alerts').innerHTML=al.length?'<ul class="acts" style="gap:10px">'+al.map(function(x){return '<li style="grid-template-columns:minmax(0,1fr) auto"><span><b>'+esc(x.s.name)+'</b><br><span class="hint">'+esc(x.c.reasons.join('; '))+'</span></span>'+pill(x.c.lvl)+'</li>'}).join('')+'</ul>':'<p class="note">Сегодня никому: вся группа идёт по графику.</p>';
}
function wcheck(){
  var d=S.discs[S.di],t=wsum(d),el=$('#wcheck');if(!el)return;
  el.innerHTML=t===100?'Сумма весов: <b>100</b>, всё в порядке.':'<b style="color:var(--bad)">Сумма весов '+t+'.</b> Для 100-балльной шкалы она должна быть равна 100.';
}
function csv(){
  var d=S.discs[S.di];
  var h=['Студент'].concat(d.acts.map(function(a){return a.name+' (%)'}),['Пропуски, нед.','РТ','Успеваемость, %','Статус']);
  var rows=d.students.map(function(s){var c=calc(d,s);
    return [s.name].concat(d.acts.map(function(a){var v=s.scores[a.id];return v===null||v===undefined?'':v}),[s.missed,f1(c.earned),c.pct===null?'':f1(c.pct),LV[c.lvl][1]]);});
  return [h].concat(rows).map(function(r){return r.map(function(x){x=String(x);return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(';')}).join('\n');
}

/* ---------- калькулятор ---------- */
var CALC={rows:[{n:'Контрольная работа',s:80,w:25},{n:'Практические',s:90,w:20},{n:'Домашние задания',s:70,w:15}],rad:75,wT:0.2};
function vCalc(){
  var rows=CALC.rows.map(function(r,i){return '<div class="calc-row"><input type="text" id="cn'+i+'" data-c="n" data-i="'+i+'" value="'+esc(r.n)+'" aria-label="Название"><input type="number" id="cs'+i+'" data-c="s" data-i="'+i+'" min="0" max="100" value="'+r.s+'" aria-label="Оценка S"><input type="number" id="cw'+i+'" data-c="w" data-i="'+i+'" min="0" max="100" value="'+r.w+'" aria-label="Вес W"><span class="num" id="cb'+i+'"></span><button class="btn" data-cdel="'+i+'" aria-label="Удалить строку" style="padding:2px 8px;min-height:30px">✕</button></div>'}).join('');
  $('#view').innerHTML='<div class="head"><div><h2>Калькулятор БРС</h2><p>Проверьте, сколько баллов даст работа и что нужно получить на экзамене. Формулы взяты из методики проекта.</p></div></div>'+
   '<div class="two"><section class="card"><h3>1. Баллы за действие и текущий рейтинг</h3><div class="formula">B = (S × W) / 100</div><div class="formula">РТ = Σ B</div>'+
   '<div class="calc-row h"><span>Вид работы</span><span>S, %</span><span>W</span><span>B</span><span></span></div>'+rows+
   '<button class="btn" id="cAdd">+ Добавить строку</button><div class="row"><b>Текущий рейтинг РТ</b><span class="num" id="cRT" style="font-size:22px;font-weight:600"></span></div></section>'+
   '<section class="card"><h3>2. Итоговый рейтинг по дисциплине</h3><div class="formula">РИД = РТ × 0,2 + РАД × 0,8</div>'+
   '<div class="settings"><label>РТ (из блока 1, масштаб 100)<input type="number" id="cRT2" readonly></label><label>РАД: рейтинг за аттестацию<input type="number" id="cRAD" min="0" max="100" value="'+CALC.rad+'"></label><label>Вес РТ<input type="number" id="cWT" min="0" max="1" step="0.05" value="'+CALC.wT+'"></label></div>'+
   '<div class="row"><b>РИД (округлён)</b><span class="num" id="cRID" style="font-size:22px;font-weight:600"></span></div><p class="note" id="cGr"></p>'+
   '<p class="hint">Если веса видов работ в сумме меньше 100, РТ считается по набранным баллам: остальные работы ещё впереди.</p></section></div>';
  calcOut();
}
function calcOut(){
  var rt=0;
  CALC.rows.forEach(function(r,i){var b=(+r.s||0)*(+r.w||0)/100;rt+=b;var el=$('#cb'+i);if(el)el.textContent=f1(b)});
  $('#cRT').textContent=f1(rt);$('#cRT2').value=Math.round(rt*10)/10;
  var rid=Math.round(rt*CALC.wT+CALC.rad*(1-CALC.wT));
  $('#cRID').textContent=rid;
  var g=rid>=85?5:rid>=70?4:rid>=55?3:2;
  $('#cGr').textContent=g===2?'Итог ниже 55: дисциплина не сдана, потребуется пересдача.':'Оценка по шкале 85 / 70 / 55: «'+g+'».';
}

/* ---------- о системе ---------- */
function vAbout(){
  $('#view').innerHTML='<div class="head"><div><h2>О системе</h2><p>Сайт — итоговый продукт проекта «Академический успех» (команда «Космос», наставник Д. В. Наумкин). Он превращает баллы за семестр в понятный рейтинг и даёт ранний сигнал, пока долг ещё можно закрыть.</p></div></div>'+
  '<div class="two"><section class="card"><h3>Как считаются баллы</h3><div class="formula">B = (S × W) / 100</div><p class="note">S — результат за работу в процентах, W — вес работы. Сумма весов всех работ равна 100.</p><div class="formula">РТ = Σ B</div><p class="note">Текущий рейтинг — сумма набранных баллов за семестр.</p><div class="formula">РИД = РТ × 0,2 + РАД × 0,8</div><p class="note">Итоговый рейтинг: взвешенное среднее текущего рейтинга и аттестации, округляется до целого. Веса и пороги преподаватель меняет в настройках дисциплины.</p></section>'+
  '<section class="card"><h3>Правила и сигналы</h3><ul class="acts" style="gap:12px"><li style="display:block"><b>Автомат.</b> Если студент набрал 60% и больше, он получает оценку без экзамена (порог настраивается).</li><li style="display:block"><b>Шкала оценок.</b> 85+ → «5», 70+ → «4», 55+ → «3», ниже → «2».</li><li style="display:block"><b>Ранний сигнал.</b> Из интервью с Управлением по воспитательной работе: 2–3 недели пропусков подряд в первый месяц почти наверняка ведут к долгам на сессии. Поэтому 2 недели дают статус «Следить», 3 и больше — «Нужна помощь».</li><li style="display:block"><b>Статус «Нужна помощь».</b> Успеваемость ниже 50% от набранного максимума или 3+ недели пропусков.</li><li style="display:block"><b>Критическая доля.</b> Учебный отдел считает критичным 10–12% отчислений по неуспеваемости на курсе. Сводка преподавателя сравнивает долю группы в красной зоне с этим порогом.</li></ul></section></div>'+
  '<section class="card"><div class="row"><div><h3>Сбросить демо-данные</h3><p class="note">Вернёт исходные группу и настройки. Ваши правки в журнале пропадут.</p></div><span id="resetBox"><button class="btn danger" id="reset">Сбросить</button></span></div></section>';
}

/* ---------- события ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){go(t.dataset.tab);return}
  var d=S.discs[S.di];
  if(t.id==='addSt'){var id='s'+Date.now();S.discs.forEach(function(x){var sc={};x.acts.forEach(function(a){sc[a.id]=null});x.students.push({id:id,name:'Новый студент',scores:sc,missed:0})});save();vTeacher();return}
  if(t.dataset.del){S.discs.forEach(function(x){x.students=x.students.filter(function(s){return s.id!==t.dataset.del})});if(S.si>=S.discs[0].students.length)S.si=0;save();vTeacher();return}
  if(t.id==='mkCsv'){S.csv=csv();save();vTeacher();return}
  if(t.id==='copyCsv'){var ta=$('#csvText');ta.select();var ok=false;try{navigator.clipboard.writeText(ta.value).then(function(){t.textContent='Скопировано'},function(){document.execCommand&&document.execCommand('copy');t.textContent='Скопировано'});ok=true}catch(x){}if(!ok){try{document.execCommand('copy');t.textContent='Скопировано'}catch(y){}}return}
  if(t.id==='cAdd'){CALC.rows.push({n:'Новая работа',s:0,w:0});vCalc();return}
  if(t.dataset.cdel!==undefined){CALC.rows.splice(+t.dataset.cdel,1);vCalc();return}
  if(t.id==='reset'){
    var box=$('#resetBox');box.innerHTML='<span class="note">Точно сбросить? </span><button class="btn danger" id="reset2">Да, сбросить</button> <button class="btn" id="reset0">Отмена</button>';return}
  if(t.id==='reset2'){S=init();save();go('about');return}
  if(t.id==='reset0'){vAbout()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='pickStudent'){S.si=+t.value;save();vStudent()}
  if(t.id==='pickDisc'){S.di=+t.value;save();vTeacher()}
  if(t.id==='onlyRisk'){S.onlyRisk=t.checked;save();drawRows()}
});
document.addEventListener('input',function(e){
  var t=e.target,d=S.discs[S.di],k=t.dataset.k;
  if(t.dataset.c){
    var r=CALC.rows[+t.dataset.i];r[t.dataset.c]=t.dataset.c==='n'?t.value:clamp(+t.value||0,0,100);calcOut();return}
  if(t.id==='cRAD'){CALC.rad=clamp(+t.value||0,0,100);calcOut();return}
  if(t.id==='cWT'){CALC.wT=clamp(+t.value||0,0,1);calcOut();return}
  if(!k)return;
  var st=t.dataset.sid&&d.students.filter(function(s){return s.id===t.dataset.sid})[0];
  if(k==='name'&&st){S.discs.forEach(function(x){x.students.forEach(function(s){if(s.id===st.id)s.name=t.value})});save();summary();return}
  if(k==='score'&&st){st.scores[t.dataset.aid]=t.value===''?null:clamp(Math.round(+t.value),0,100)}
  else if(k==='missed'&&st){st.missed=clamp(Math.round(+t.value||0),0,20)}
  else if(k==='w'){var a=d.acts.filter(function(x){return x.id===t.dataset.aid})[0];a.w=clamp(+t.value||0,0,100);var th=$('#th-'+a.id);if(th)th.textContent='вес '+a.w;wcheck()}
  else if(k==='auto'){d.auto=clamp(+t.value||0,0,100)}
  else if(k==='pass'){d.pass=clamp(+t.value||0,0,100)}
  else if(k==='wT'){d.wT=clamp(+t.value||0,0,1)}
  save();
  d.students.forEach(function(s){refreshRow(s.id)});summary();
});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TABS.some(function(t){return t[0]===h})&&h!==S.tab)go(h,true)});
var h0=location.hash.slice(1);if(TABS.some(function(t){return t[0]===h0}))S.tab=h0;
if(!TABS.some(function(t){return t[0]===S.tab}))S.tab='student';
render();
})();
</script>

</body></html>
